[package]
name = "native"
version.workspace = true
edition.workspace = true
# The [[bin]] list below is the whole list. Without this, Cargo autodiscovers
# every file in src/bin/ as an extra binary target, which is how 21 one-off R&D
# probes ended up compiling (and getting a test harness linked) on every
# `cargo build --workspace` / `cargo test --workspace`. Those now live in
# native/examples/ — see the README there. Adding a binary means adding it here.
autobins = false

[dependencies]
analysis = { path = "../analysis" }
clap = { workspace = true, features = ["derive"] }
dem = { workspace = true }
dod = { path = "../dod" }
filetime = { workspace = true }
humantime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
tabled = { workspace = true }
chrono = "0.4.45"
web-time = { workspace = true }
nom = { workspace = true }
log = { workspace = true }
dirs = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process", "fs", "sync", "io-util", "time"] }
walkdir = "2.5.0"
hl-demo-auditor = { path = "../hl-demo-auditor" }
rfd = "0.14"
open = "5.1"
sysinfo = { workspace = true }
keepawake = "0.6"
# Map fetching (see patch/map_fetch.rs). Blocking and small on purpose: the
# download runs on a worker thread and verifies before it installs, so there is
# nothing for an async client to overlap with.
ureq = "3"
# obs-websocket client (docs/obs_alternate_capture.md, #65). Blocking, like
# `ureq` above and for the same reason: the capture engine is thread-and-poll
# throughout, and `CaptureCleanupGuard::drop` has to be able to send a
# `StopRecord` without an async runtime under it. `sha2`/`base64` are only for
# the v5 challenge/salt handshake.
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
sha2 = "0.11.0"
base64 = "0.23.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4.50"
console_error_panic_hook = { workspace = true }
js-sys = { workspace = true }
web-sys = { version = "0.3.77", features = ["HtmlCanvasElement", "Window", "Document", "Element", "File", "Storage", "Worker", "Blob", "Url", "DedicatedWorkerGlobalScope", "MessageEvent", "HtmlCollection", "NodeList"] }

# ── Binaries ────────────────────────────────────────────────────────────────
# Real tools, not probes. Anything exploratory belongs in native/examples/,
# which builds only on `cargo run --example` / `cargo build --examples`.

# Headless preview builder: demos -> `<stem>_preview.dem` with a bookmark on
# every highlight. The app shells out to this.
[[bin]]
name = "preview_cli"
path = "src/bin/preview_cli/main.rs"

# Terminal demo analyzer (scoreboards, kills, chat, rounds).
[[bin]]
name = "dod-tools-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "dod-tools-dump"
path = "src/bin/dump.rs"

[[bin]]
name = "dod-tools-inspect"
path = "src/bin/inspect.rs"

# Map-library verification and fetch for a demo folder.
[[bin]]
name = "check_maps"
path = "src/bin/check_maps.rs"

# Reports banned/hazardous commands in the user's game .cfg files. Read-only.
[[bin]]
name = "check_cfgs"
path = "src/bin/check_cfgs.rs"

[[bin]]
name = "strip_decals"
path = "src/bin/strip_decals.rs"

[lints]
workspace = true

[package]
name = "web-analyzer"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
analysis = { path = "../analysis" }
serde = { workspace = true }
serde-wasm-bindgen = "0.6.5"
# Pinned exactly: the deploy workflow installs a matching wasm-bindgen-cli
# version to post-process the .wasm build, and a mismatched CLI/crate pair
# fails at that step. Bump both together.
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true }

[lints]
workspace = true

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DoD Studio QA Manifest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #12141a;
    --surface: #1b1e26;
    --surface-2: #232732;
    --border: #2c313c;
    --border-soft: #262a34;
    --text: #e7e9ee;
    --text-muted: #8991a1;
    --text-faint: #565c6a;
    --accent: #5b9bd8;
    --accent-dim: #3d6f97;
    --good: #4fb477;
    --warn: #e0a63f;

    --font-display: "Oswald", "Arial Narrow", sans-serif;
    --font-body: "IBM Plex Sans", "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", "Consolas", monospace;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f1ec;
      --surface: #ffffff;
      --surface-2: #ecebe4;
      --border: #dcdad0;
      --border-soft: #e6e4dc;
      --text: #1c1e23;
      --text-muted: #5c5f68;
      --text-faint: #9a9ca3;
      --accent: #2f6fa8;
      --accent-dim: #bcd6ea;
      --good: #2e8f57;
      --warn: #a86c1c;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  .shell-head { margin-bottom: 18px; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--accent);
    text-transform: uppercase;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: clamp(26px, 5vw, 34px);
    margin: 4px 0 0;
    text-wrap: balance;
  }

  .picker {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 18px 0;
  }

  .picker-tab {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.02em;
    background: var(--surface);
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 12px;
    cursor: pointer;
    display: flex;
    align-items: baseline;
    gap: 8px;
    text-align: left;
  }

  .picker-tab:hover { border-color: var(--text-faint); color: var(--text); }
  .picker-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .picker-tab.active {
    border-color: var(--accent);
    color: var(--text);
    background: var(--surface-2);
  }

  .picker-tab .frac {
    font-variant-numeric: tabular-nums;
    color: var(--text-faint);
    font-size: 11px;
  }
  .picker-tab.active .frac { color: var(--accent); }
  .picker-tab.done .frac { color: var(--good); }

  .manifest-head {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 3px;
    padding: 20px 24px 18px;
    margin-bottom: 22px;
  }

  .checklist-title {
    font-family: var(--font-display);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-size: 20px;
    font-weight: 500;
    margin: 0 0 4px;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 13.5px;
    max-width: 62ch;
    margin: 0 0 16px;
  }

  .progress-row { display: flex; align-items: center; gap: 14px; }

  .progress-track {
    flex: 1;
    height: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    transition: width 0.35s ease;
  }

  .progress-count {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 13.5px;
    color: var(--text-muted);
    white-space: nowrap;
    min-width: 5.5em;
    text-align: right;
  }

  .head-actions { display: flex; justify-content: flex-end; margin-top: 12px; }

  .reset-btn {
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: transparent;
    color: var(--text-faint);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .reset-btn:hover { color: var(--text-muted); border-color: var(--text-faint); }
  .reset-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .section {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 3px;
    margin-bottom: 14px;
    overflow: hidden;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border-soft);
    border-left: 3px solid var(--accent);
  }

  .section-head.note-only { border-left-color: var(--warn); }

  .section-title {
    font-family: var(--font-display);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 500;
    font-size: 15.5px;
  }

  .section-note {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--warn);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .section-count {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--text-faint);
    white-space: nowrap;
  }

  ul.items { list-style: none; margin: 0; padding: 4px 0; }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 8px 16px;
    cursor: pointer;
    user-select: none;
  }

  .item:hover { background: var(--surface-2); }

  .box {
    flex-shrink: 0;
    width: 17px;
    height: 17px;
    margin-top: 2px;
    border: 1.5px solid var(--text-faint);
    border-radius: 2px;
    position: relative;
    transition: background 0.12s ease, border-color 0.12s ease;
  }

  .item.checked .box { background: var(--good); border-color: var(--good); }

  .box::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 1px;
    width: 5px;
    height: 9px;
    border: solid var(--bg);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
    opacity: 0;
  }

  .item.checked .box::after { opacity: 1; }

  .item-text { font-size: 14px; color: var(--text); }

  .item.checked .item-text {
    color: var(--text-faint);
    text-decoration: line-through;
    text-decoration-color: var(--text-faint);
    text-decoration-thickness: 1px;
  }

  code {
    font-family: var(--font-mono);
    font-size: 0.92em;
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: 2px;
    padding: 0 4px;
  }

  footer {
    margin-top: 26px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-faint);
    text-align: center;
  }

  .state-banner {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 3px;
    padding: 20px 24px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .state-banner strong { color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    .progress-fill { transition: none; }
    .box { transition: none; }
  }

  @media (max-width: 480px) {
    .wrap { padding: 18px 12px 60px; }
    .manifest-head { padding: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="shell-head">
    <div class="eyebrow">DoD Studio</div>
    <h1>QA Manifest</h1>
  </div>

  <div class="picker" id="picker"></div>
  <div id="root"></div>

  <footer id="sourceNote"></footer>
</div>

<script>
(function () {
  var manifestHeadHTML =
    '<div class="manifest-head">' +
    '  <div class="checklist-title" id="activeTitle"></div>' +
    '  <p class="subtitle" id="activeSubtitle"></p>' +
    '  <div class="progress-row">' +
    '    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>' +
    '    <div class="progress-count" id="progressCount">0 / 0</div>' +
    '  </div>' +
    '  <div class="head-actions"><button class="reset-btn" id="resetBtn" type="button">Reset this checklist</button></div>' +
    '</div>' +
    '<div id="sections"></div>';

  function showState(html) {
    document.getElementById("picker").innerHTML = "";
    document.getElementById("root").innerHTML = '<div class="state-banner">' + html + '</div>';
    document.getElementById("sourceNote").textContent = "";
  }

  function slug(str) {
    return str.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "").slice(0, 40);
  }

  function storageKeyFor(id) { return "dod-studio-checklist-v1:" + id; }

  function loadState(id) {
    try { return JSON.parse(localStorage.getItem(storageKeyFor(id)) || "{}"); }
    catch (e) { return {}; }
  }

  function saveState(id, state) {
    try { localStorage.setItem(storageKeyFor(id), JSON.stringify(state)); }
    catch (e) { /* private mode etc — still works in-memory for this load */ }
  }

  function checklistProgress(checklist) {
    var state = loadState(checklist.id);
    var total = 0, checked = 0;
    checklist.sections.forEach(function (section, sIdx) {
      section.items.forEach(function (text, iIdx) {
        total++;
        var id = "s" + sIdx + "-" + slug(text) + "-" + iIdx;
        if (state[id]) checked++;
      });
    });
    return { checked: checked, total: total };
  }

  fetch("/api/checklists")
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (checklists) {
      if (!checklists.length) {
        showState(
          "No checklists found. Drop a <code>.json</code> file into <code>docs/qa_checklists/</code> " +
          "(see <code>README.md</code> in that folder for the schema), then refresh this page."
        );
        return;
      }
      init(checklists);
    })
    .catch(function () {
      showState(
        "<strong>Can't reach the checklist server.</strong><br><br>" +
        "This page needs to be served, not opened directly as a file — run:<br>" +
        "<code>node docs/qa_checklists/server.js</code><br><br>" +
        "then open the URL it prints (defaults to <code>http://localhost:5680/</code>)."
      );
    });

  function init(CHECKLISTS) {
    var ACTIVE_KEY = "dod-studio-qa-manifest-active";
    var activeId = null;
    try { activeId = localStorage.getItem(ACTIVE_KEY); } catch (e) { /* ignore */ }
    if (!CHECKLISTS.some(function (c) { return c.id === activeId; })) {
      activeId = CHECKLISTS[CHECKLISTS.length - 1].id;
    }

    var pickerEl = document.getElementById("picker");
    var rootEl = document.getElementById("root");

    function renderPicker() {
      pickerEl.innerHTML = "";
      CHECKLISTS.forEach(function (c) {
        var p = checklistProgress(c);
        var tab = document.createElement("button");
        tab.type = "button";
        tab.className = "picker-tab" + (c.id === activeId ? " active" : "") + (p.total > 0 && p.checked === p.total ? " done" : "");
        tab.innerHTML = '<span>' + c.label + '</span><span class="frac">' + p.checked + '/' + p.total + '</span>';
        tab.addEventListener("click", function () {
          activeId = c.id;
          try { localStorage.setItem(ACTIVE_KEY, activeId); } catch (e) { /* ignore */ }
          renderAll();
        });
        pickerEl.appendChild(tab);
      });
    }

    function renderChecklist() {
      var checklist = CHECKLISTS.find(function (c) { return c.id === activeId; });
      rootEl.innerHTML = manifestHeadHTML;
      document.getElementById("activeTitle").textContent = checklist.title;
      document.getElementById("activeSubtitle").textContent = checklist.subtitle || "";
      document.getElementById("sourceNote").textContent =
        "docs/qa_checklists/" + checklist.id + ".json · progress stored locally in this browser";

      var sectionsEl = document.getElementById("sections");
      var state = loadState(checklist.id);
      var totalItems = 0;

      checklist.sections.forEach(function (section, sIdx) {
        var sectionEl = document.createElement("div");
        sectionEl.className = "section";

        var head = document.createElement("div");
        head.className = "section-head" + (section.note ? " note-only" : "");

        var titleWrap = document.createElement("div");
        var title = document.createElement("div");
        title.className = "section-title";
        title.textContent = section.title;
        titleWrap.appendChild(title);
        if (section.note) {
          var note = document.createElement("div");
          note.className = "section-note";
          note.textContent = section.note;
          titleWrap.appendChild(note);
        }
        head.appendChild(titleWrap);

        var countEl = document.createElement("div");
        countEl.className = "section-count";
        countEl.id = "count-" + sIdx;
        head.appendChild(countEl);

        sectionEl.appendChild(head);

        var list = document.createElement("ul");
        list.className = "items";

        section.items.forEach(function (text, iIdx) {
          var id = "s" + sIdx + "-" + slug(text) + "-" + iIdx;
          totalItems++;

          var li = document.createElement("li");
          li.className = "item";
          if (state[id]) li.classList.add("checked");

          var box = document.createElement("span");
          box.className = "box";

          var textEl = document.createElement("span");
          textEl.className = "item-text";
          textEl.textContent = text;

          li.appendChild(box);
          li.appendChild(textEl);
          li.addEventListener("click", function () {
            var checked = !li.classList.contains("checked");
            li.classList.toggle("checked", checked);
            state[id] = checked;
            saveState(checklist.id, state);
            updateSectionCount(sIdx);
            updateProgress();
            renderPicker();
          });

          list.appendChild(li);
        });

        sectionEl.appendChild(list);
        sectionsEl.appendChild(sectionEl);
      });

      function updateSectionCount(sIdx) {
        var section = checklist.sections[sIdx];
        var checked = sectionsEl.querySelectorAll('.section:nth-child(' + (sIdx + 1) + ') .item.checked').length;
        document.getElementById("count-" + sIdx).textContent = checked + " / " + section.items.length;
      }

      function updateProgress() {
        var checkedTotal = sectionsEl.querySelectorAll(".item.checked").length;
        var pct = totalItems > 0 ? Math.round((checkedTotal / totalItems) * 100) : 0;
        document.getElementById("progressFill").style.width = pct + "%";
        document.getElementById("progressCount").textContent = checkedTotal + " / " + totalItems;
      }

      checklist.sections.forEach(function (_, sIdx) { updateSectionCount(sIdx); });
      updateProgress();

      document.getElementById("resetBtn").addEventListener("click", function () {
        saveState(checklist.id, {});
        renderAll();
      });
    }

    function renderAll() {
      renderPicker();
      renderChecklist();
    }

    renderAll();
  }
})();
</script>
</body>
</html>

name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web-analyzer/**'
      - 'analysis/**'
      - 'dod/**'
      - 'dem-patch/**'
      - '.github/workflows/deploy_web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Version must match the workspace's pinned wasm-bindgen dependency exactly
      # (`wasm-bindgen = "=0.2.126"` under [workspace.dependencies] in the root
      # Cargo.toml; web-analyzer takes it from there).
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Build web-analyzer (wasm32, release)
        run: cargo build -p web-analyzer --target wasm32-unknown-unknown --release

      - name: Generate JS bindings
        run: |
          wasm-bindgen --target web --out-dir web-analyzer/www/pkg \
            target/wasm32-unknown-unknown/release/web_analyzer.wasm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web-analyzer/www'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

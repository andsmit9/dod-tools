name: Release desktop-studio (Stable)

# Fires automatically on every push to main — in this repo's flow, main is
# ruleset-protected (PR-only, non-fast-forward), so every push is really a
# dev->main release-cutover merge; there's no other kind of push that lands
# here. See issue #133 and desktop-studio/src-tauri/src/updater_manager.rs:
# this workflow's GitHub Release is exactly what the app's "stable" update
# channel polls, via GitHub's `/releases/latest` alias (works because this
# release is neither a draft nor a prerelease).
#
# Versioning: Cargo.toml's checked-in version is read for its major.minor
# only — the patch number is computed by finding the highest existing
# `v<major>.<minor>.*` tag and incrementing it (0 if none exist yet), so a
# routine merge to main just becomes the next patch with no manual step.
# Bumping to a new minor/major (0.1 -> 0.2, or eventually 0.x -> 1.0) is
# just editing Cargo.toml's version as part of the release PR — there's no
# existing tag under the new prefix yet, so the next patch computes to 0.
# workflow_dispatch's version input is a manual override for the rare case
# that needs one; leave it blank to use the same auto-computed version.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 0.11.0 — no leading 'v'). Leave blank to auto-compute the next patch under Cargo.toml's major.minor."
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full tag history — needed to find the last patch under this major.minor

      - name: Compute release version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$MANUAL_VERSION" ]; then
            echo "RELEASE_VERSION=${MANUAL_VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MAJOR_MINOR=$(grep -m1 '^version = ' desktop-studio/src-tauri/Cargo.toml | sed -E 's/version = "([0-9]+\.[0-9]+)\.[0-9]+.*/\1/')
          LATEST_PATCH=$(git tag -l "v${MAJOR_MINOR}.*" | sed -E "s/^v${MAJOR_MINOR}\.//" | sort -n | tail -1)
          NEXT_PATCH=$(( ${LATEST_PATCH:--1} + 1 ))
          echo "RELEASE_VERSION=${MAJOR_MINOR}.${NEXT_PATCH}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # DoD/GoldSrc is a 32-bit engine, so this companion DLL (see
      # goldsrc-hooks/README.md) needs its own cross-build -- the rest of the
      # app builds for the host's native 64-bit target. Built before
      # tauri-action so tauri.conf.json's `bundle.resources` entry for it
      # already exists on disk when bundling runs.
      - name: Build goldsrc-hooks (32-bit DoD/GoldSrc companion DLL)
        run: cargo build -p goldsrc-hooks --release --target i686-pc-windows-msvc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop-studio/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop-studio
        run: npm ci

      # Stamps this run's version into the two Tauri-side manifests. Not
      # committed back — the repo's checked-in version stays whatever it was;
      # only this build (and the release it produces) carries the computed
      # number.
      - name: Set release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.RELEASE_VERSION }}
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.RELEASE_VERSION;
            for (const path of ['desktop-studio/src-tauri/tauri.conf.json', 'desktop-studio/package.json']) {
              const json = JSON.parse(fs.readFileSync(path, 'utf8'));
              json.version = version;
              fs.writeFileSync(path, JSON.stringify(json, null, 2) + '\n');
            }
          "
          # tauri.conf.json's version is a display/manifest value only — Rust
          # bakes CARGO_PKG_VERSION into the compiled binary from Cargo.toml,
          # which is what tauri-action actually uses for bundle filenames and
          # the published latest.json, so it needs the same stamp.
          sed -i "s/^version = \".*\"/version = \"${RELEASE_VERSION}\"/" desktop-studio/src-tauri/Cargo.toml

      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop-studio
          tagName: v${{ steps.version.outputs.RELEASE_VERSION }}
          releaseName: "DoD Tools Studio v${{ steps.version.outputs.RELEASE_VERSION }}"
          releaseBody: "See assets below to download."
          releaseDraft: false
          prerelease: false
